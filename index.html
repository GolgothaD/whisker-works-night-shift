function build(i){const g=new THREE.Group(),parts={};
 switch(i){
 case 0:{const a=gearMesh(.42,9,RUST);a.position.y=.6;const b=gearMesh(.24,7,IRON);b.position.set(.48,.38,.05);g.add(a,b);parts.spin=[[a,1.3],[b,-2.2]];g.add(mesh(new THREE.BoxGeometry(.9,.12,.4),WOOD,.2,.06,0));break}
 case 1:{const pts=[];for(let k=0;k<=40;k++){const a=k/40*Math.PI*10;pts.push(new THREE.Vector3(Math.cos(a)*.16,.1+k/40*.6,Math.sin(a)*.16))}

  g.add(cup,ramp,mesh(new THREE.CylinderGeometry(.04,.04,.9,5),WOOD,-.2,.45,0));parts.cup=cup;break}
 case 3:{const c=new THREE.CatmullRomCurve3([new THREE.Vector3(-.4,1.1,0),new THREE.Vector3(.3,.8,.1),new THREE.Vector3(-.3,.45,-.1),new THREE.Vector3(.4,.15,0)]);g.add(mesh(new THREE.TubeGeometry(c,24,.07,6),RUST));break}
 case 4:{parts.dom=[];for(let k=0;k<5;k++){const d=mesh(new THREE.BoxGeometry(.1,.46,.26),BONE,-.4+k*.2,.23,0);d.geometry.translate(0,0,0);const piv=new THREE.Group();piv.position.set(-.4+k*.2+.05,0,0);d.position.set(-.05,.23,0);piv.add(d);g.add(piv);parts.dom.push(piv)}break}
 case 5:{g.add(mesh(new THREE.CylinderGeometry(.03,.04,1,5),IRON,0,.5,0));const hub=new THREE.Group();hub.position.set(0,1.02,.06);for(let k=0;k<4;k++){const b=mesh(new THREE.BoxGeometry(.5,.12,.02),M([0x5a1018,0x3a3226,0x5a1018,0x3a3226][k]));b.position.x=.25;const p=new THREE.Group();p.rotation.z=k*Math.PI/2;p.add(b);hub.add(p)}g.add(hub);parts.spin=[[hub,.4]];parts.hubAxis='z';break}
 case 6:{g.add(mesh(new THREE.ConeGeometry(.16,.3,4),WOOD,0,.15,0));const plank=new THREE.Group();plank.position.y=.32;plank.add(mesh(new THREE.BoxGeometry(1.1,.06,.22),RUST));
  const duck=new THREE.Group();duck.add(mesh(new THREE.SphereGeometry(.15,8,6),M(0x8a7a2a)));const hd=mesh(new THREE.SphereGeometry(.09,8,6),M(0x8a7a2a),.1,.13,0);duck.add(hd);
  duck.add(mesh(new THREE.SphereGeometry(.02,4,3),M(0xff2222,{emissive:0xff0000,emissiveIntensity:2}),.16,.16,.06,false));duck.position.set(-.4,.14,0);plank.add(duck);g.add(plank);parts.plank=plank;break}

function creak(){const c=AU.ctx;if(!c)return;const t=c.currentTime,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';const f0=90+Math.random()*80;o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*(.6+Math.random()*.8),t+.9);
 f.type='bandpass';f.frequency.value=700+Math.random()*600;f.Q.value=12;env(g,t,.15,.12,1);
 const am=c.createOscillator(),ag=c.createGain();am.frequency.value=18+Math.random()*20;ag.gain.value=.5;am.connect(ag).connect(g.gain);am.start(t);am.stop(t+1.3);o.connect(f).connect(g).connect(AU.master);o.start(t);o.stop(t+1.3)}
function creakLoop(){creak();setTimeout(creakLoop,4000+Math.random()*7000)}
function noiseHit(t,dur,freq,vol){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=c.createGain();env(g,t,.005,vol,dur);s.connect(f).connect(g).connect(AU.master);s.start(t,Math.random());s.stop(t+dur+.1)}
function tone(t,f,dur,vol,type='sine',slide){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);env(g,t,.01,vol,dur);o.connect(g).connect(AU.master);o.start(t);o.stop(t+dur+.1)}
const SFX={
 step(){if(!AU.ctx)return;noiseHit(AU.ctx.currentTime,.06,1200,.08)},
 build(){if(!AU.ctx)return;const t=AU.ctx.currentTime;noiseHit(t,.12,3000,.25);tone(t,220,.25,.15,'square',110);tone(t+.08,330,.2,.1,'square',160)},
 tick(){if(!AU.ctx)return;const t=AU.ctx.currentTime;tone(t,900+Math.random()*300,.05,.12,'square');noiseHit(t,.05,4000,.1)},
 slam(){if(!AU.ctx)return;const t=AU.ctx.currentTime;tone(t,60,1.2,.9,'sine',28);noiseHit(t,.6,900,.9);[311,330,466,494].forEach(f=>tone(t+.02,f,1.6,.07,'sawtooth',f*.97));tone(t,1800,.7,.05,'triangle',1700)},
 sting(){if(!AU.ctx)return;const t=AU.ctx.currentTime;[220,233,311].forEach(f=>tone(t,f,1.4,.06,'sawtooth',f*.92))},
 squeak(){if(!AU.ctx)return;const t=AU.ctx.currentTime;tone(t,1900,.25,.12,'sine',2600)}};
$('mute').onclick=()=>{AU.muted=!AU.muted;$('mute').textContent=AU.muted?'🔇':'🔊';if(AU.master)AU.master.gain.value=AU.muted?0:.7};
// ---------- camera control ----------
const camS={theta:-.15,phi:.72,r:11.5,target:new THREE.Vector3(0,0,0),goal:new THREE.Vector3(0,0,0),shake:0,user:0};
{let ptrs=new Map(),pd=0;const el=$('gl');
 el.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const [px,py]=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size==1){camS.theta-=(e.clientX-px)*.006;camS.phi=Math.min(1.35,Math.max(.35,camS.phi-(e.clientY-py)*.005));camS.user=2.5}
  else if(ptrs.size==2){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)camS.r=Math.min(16,Math.max(4,camS.r*pd/d));pd=d;camS.user=2.5}});
 const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pd=0};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 el.addEventListener('wheel',e=>{camS.r=Math.min(16,Math.max(4,camS.r*(1+e.deltaY*.001)));camS.user=2.5},{passive:true})}
// ---------- game state ----------
let G,anims=[],time=0,toastT=0;
function tween(dur,fn,done){anims.push({t:0,dur,fn,done})}
function say(s){const t=$('toast');t.textContent=s;t.style.opacity=s?1:0}
function reset(){MM.forEach(m=>S.remove(m));STATS={turns:0,cranks:0,catches:0,built:0};
 G={p:MICE.slice(0,CFG.n).map((m,i)=>({pos:0,cheese:6,out:false,ai:!!CFG.ai[i]})),turn:0,built:0,can:false,over:false,busy:false,chain:-1};
 MM=G.p.map((p,i)=>{const m=makeMouse(MICE[i].c);m.position.set(PATH[0].x+OFF[i][0],.1,PATH[0].z+OFF[i][1]);S.add(m);return m});
 PIECE.forEach(g=>{g.visible=false;g.scale.setScalar(.001);g.userData.ghost.visible=true});CAGE.visible=false;CAGE.position.y=CAGE_UP;bar();say('')}
function bar(){$('bar').innerHTML=G.p.map((p,i)=>`<div class="pl ${G.turn==i&&!G.over?'on':''} ${p.out?'out':''}"><span class="dot" style="background:#${MICE[i].c.toString(16)}"></span> <b>${MICE[i].n}</b>${p.ai?' 🤖':''}<br>🧀 ${p.cheese}</div>`).join('')}
function ui(){const me=!G.p[G.turn].ai&&!G.over&&!G.busy;$('roll').disabled=!me;$('crank').disabled=!(me&&G.can);bar()}
function focus(v){camS.goal.copy(v)}
function walk(i,steps,done){const p=G.p[i];if(!steps)return done();const dir=Math.sign(steps),np=(p.pos+dir+N)%N,m=MM[i],s=m.position.clone(),t=new THREE.Vector3(PATH[np].x+OFF[i][0],.1,PATH[np].z+OFF[i][1]);
 m.rotation.y=-Math.atan2(t.z-s.z,t.x-s.x);tween(.28,k=>{const e=ease(k);m.position.lerpVectors(s,t,e);m.position.y=.1+Math.sin(k*Math.PI)*.35;m.userData.body.scale.y=.85*(1+Math.sin(k*Math.PI)*.15);focus(m.position)},
 ()=>{p.pos=np;SFX.step();walk(i,steps-dir,done)})}
const DF='⚀⚁⚂⚃⚄⚅';
function doRoll(){const i=G.turn;G.busy=true;G.can=false;ui();const d=1+Math.floor(Math.random()*6);$('dice').classList.add('spin');
 const iv=setInterval(()=>$('dice').textContent=DF[Math.floor(Math.random()*6)],60);
 wait(()=>{clearInterval(iv);$('dice').classList.remove('spin');$('dice').textContent=DF[d-1];walk(i,d,()=>land(i,d))},600)}
function land(i,d){const p=G.p[i],t=TYPES[p.pos],n=MICE[i].n;
 if(t=='B'&&G.built<8){const k=G.built++;STATS.built++;const g=PIECE[k];g.visible=true;g.userData.ghost.visible=false;if(k==7)CAGE.visible=true;SFX.build();focus(SLOTS[k]);
  tween(.6,e=>g.scale.setScalar(Math.max(.001,1.35*back(e))));say(n+' bolted on the '+PIECES[k]+'…');return after(1100)}
 if(t=='C'){p.cheese+=1;say(n+' found a mouldy crumb. +1 🧀');return after(800)}
 if(t=='G'){say('A cold draught drags '+n+' back 3…');SFX.sting();return wait(()=>walk(i,-3,()=>after(300)),600)}
 if(t=='K'){if(G.built==8){G.can=true;const any=G.p.some((q,j)=>j!=i&&!q.out&&inZone(q));
   if(p.ai){if(any||Math.random()<.3)return wait(doCrank,900);say(n+' hesitates at the crank…');return after(900)}
   say(any?n+': a rival is in the CATCH ZONE — crank it!':n+' grips the crank. Crank, or roll to pass.');G.busy=false;ui();return}
  say('The crank is cold — the machine isn\'t finished.');return after(900)}
 if(t=='T'){p.cheese--;if(p.cheese<=0){p.out=true;hideMouse(i);say(n+' starved beneath the cage… 🔒')}else say(n+' trembles under the cage (−1 🧀)');SFX.sting();return after(900)}
 say(n+' rolled a '+d+'.');after(600)}
function after(ms){wait(next,ms)}
function hideMouse(i){const m=MM[i];tween(.5,k=>m.scale.setScalar(.95*(1-k)+.001),()=>m.visible=false)}
const humans=()=>G.p.filter(p=>!p.ai&&!p.out).length;
function humanTurn(){const n=MICE[G.turn].n;focus(MM[G.turn].position);if(humans()>1){G.busy=true;ui();$('passT').textContent='Pass to '+n;$('pass').classList.remove('hide')}else say('Your turn, '+n+'. Roll…')}
function next(){G.can=false;STATS.turns++;if(AUTO&&!G.over)document.title='T '+JSON.stringify(STATS);if(STATS.turns>3000){document.title='STUCK '+JSON.stringify(STATS);return}
 const alive=G.p.filter(p=>!p.out);if(alive.length<=1){G.over=true;G.busy=false;const wi=G.p.indexOf(alive[0]),wn=MICE[wi].n;focus(MM[wi].position);say('🏆 '+wn+' survives the night!');ui();
  document.title='DONE '+JSON.stringify({winner:wn,...STATS});console.log(document.title);if(AUTO)return;wait(()=>{$('title').classList.remove('hide');$('play').textContent='Another night'},3000);return}
 do G.turn=(G.turn+1)%G.p.length;while(G.p[G.turn].out);G.busy=false;ui();focus(MM[G.turn].position);
 if(G.p[G.turn].ai){G.busy=true;ui();wait(doRoll,700)}else humanTurn()}
function animatePiece(k,dur){const u=PIECE[k].userData;tween(dur,e=>{
 if(u.spin)u.spin.forEach(([o,s])=>{if(u.hubAxis)o.rotation.z+=s*.6;else o.rotation.y+=s*.3});
 if(u.boot){u.boot.position.y=.85+Math.sin(e*Math.PI)*.35;u.coil.scale.y=1+Math.sin(e*Math.PI)*.5}
 if(u.cup)u.cup.rotation.z=Math.sin(e*Math.PI)*-1.1;
 if(u.dom)u.dom.forEach((d,j)=>d.rotation.z=-Math.min(1.25,Math.max(0,e*6-j)*1.25));
 if(u.plank)u.plank.rotation.z=-.3+e*.6;
 PIECE[k].traverse(o=>{if(o.material&&o.material.emissive&&!o.userData.ownEm){o.material=o.material.clone();o.userData.ownEm=1}if(o.userData.ownEm)o.material.emissive.setRGB(.5*Math.sin(e*Math.PI),0,0)})})}
function doCrank(){STATS.cranks++;G.busy=true;G.can=false;ui();say('The machine shudders awake…');SFX.sting();let k=0;MARBLE.visible=true;
 const step=()=>{G.chain=k;animatePiece(k,.5);SFX.tick();focus(SLOTS[k]);
  if(k<7){const a=SLOTS[k].clone().setY(1.1),b=SLOTS[k+1].clone().setY(1.1);tween(.5,t=>{MARBLE.position.lerpVectors(a,b,t);MARBLE.position.y+=Math.sin(t*Math.PI)*.6},()=>{k++;step()})}
  else{MARBLE.visible=false;focus(CAGE.position.clone().setY(0));wait(slam,250)}};step()}
function slam(){const y0=CAGE_UP;tween(.22,t=>CAGE.position.y=y0-y0*t*t,()=>{CAGE.position.y=0;SFX.slam();camS.shake=1;const f=$('flash');f.style.transition='none';f.style.opacity=1;requestAnimationFrame(()=>{f.style.transition='opacity 1.1s';f.style.opacity=0});resolve()})}
function resolve(){const hit=G.p.map((q,i)=>i).filter(i=>i!=G.turn&&!G.p[i].out&&inZone(G.p[i]));
 if(hit.length){STATS.catches+=hit.length;hit.forEach(i=>{G.p[i].out=true;SFX.squeak();wait(()=>hideMouse(i),900)});say('SLAM! '+hit.map(i=>MICE[i].n).join(' & ')+' caught in the dark. 🔒')}
 else{const tg=G.p.map((q,i)=>i).filter(i=>i!=G.turn&&!G.p[i].out).sort((a,b)=>Math.abs(G.p[a].pos-TRAP)-Math.abs(G.p[b].pos-TRAP))[0],q=G.p[tg];q.cheese-=3;
  say('Empty cage… the echo terrifies '+MICE[tg].n+' (−3 🧀)'+(q.cheese<=0?' — they flee into the walls.':''));if(q.cheese<=0){q.out=true;hideMouse(tg)}}
 bar();wait(()=>tween(1,t=>CAGE.position.y=CAGE_UP*ease(t),()=>{G.chain=-1;next()}),1500)}
$('roll').onclick=()=>{if(G.can){G.can=false;next();return}doRoll()};$('crank').onclick=()=>{G.can&&doCrank()};
$('ready').onclick=()=>{$('pass').classList.add('hide');G.busy=false;ui();say('Your turn, '+MICE[G.turn].n+'. Roll…')};
function setupUI(){const cnt=$('cnt'),pl=$('plist');cnt.innerHTML='';[2,3,4].forEach(k=>{const b=document.createElement('button');b.textContent=k+' players';b.className=CFG.n==k?'':'off';b.onclick=()=>{CFG.n=k;setupUI()};cnt.appendChild(b)});
 pl.innerHTML='';for(let i=0;i<CFG.n;i++){const r=document.createElement('div');r.className='prow';r.innerHTML=`<span><span class="dot" style="background:#${MICE[i].c.toString(16)}"></span> <b>${MICE[i].n}</b></span>`;
  const sg=document.createElement('div');sg.className='seg row';['🙂 Human','🤖 Computer'].forEach((lab,j)=>{const b=document.createElement('button');b.textContent=lab;b.className=(!!CFG.ai[i])==!!j?'':'off';b.onclick=()=>{CFG.ai[i]=!!j;setupUI()};sg.appendChild(b)});r.appendChild(sg);pl.appendChild(r)}}
function startGame(){reset();$('setup').classList.add('hide');$('title').classList.add('hide');ui();if(G.p[0].ai){G.busy=true;ui();wait(doRoll,700)}else humanTurn()}
$('play').onclick=()=>{audioInit();$('title').classList.add('hide');$('setup').classList.remove('hide');setupUI()};$('start').onclick=startGame;
window.onerror=(m,u,l)=>{document.title='ERROR '+m+' @'+l};
// ---------- loop ----------
let last=performance.now();const tmp=new THREE.Vector3();
function loop(n){const rdt=Math.min(.1,(n-last)/1000),dt=rdt*SPEED;last=n;time+=rdt;
 const cur=anims;anims=[];const fin=[];cur.forEach(a=>{a.t+=dt;const k=Math.min(1,a.t/a.dur);a.fn(k);if(k>=1)fin.push(a);else anims.push(a)});fin.forEach(a=>a.done&&a.done());
 // flicker
 const fl=.75+.25*Math.sin(time*13)*Math.sin(time*7.3)+(Math.random()<.02?-.5:0);lantern.intensity=70*Math.max(.2,fl);machL.intensity=(G&&G.chain>=0?55:26)*(.85+.15*Math.sin(time*9));redL.intensity=4+3*Math.sin(time*2.2);
 // idle gear creep & tails
 PIECE.forEach(g=>{const u=g.userData;if(g.visible&&u.spin)u.spin.forEach(([o,s])=>{if(u.hubAxis)o.rotation.z+=s*rdt*.4;else o.rotation.y+=s*rdt*.1})});
 MM.forEach((m,i)=>{m.userData.tail.rotation.y=Math.sin(time*3+i)*.25});
 const dp=DUST.geometry.attributes.position;for(let i=0;i<dp.count;i++){let y=dp.getY(i)-rdt*.05;if(y<0)y=5;dp.setY(i,y);dp.setX(i,dp.getX(i)+Math.sin(time*.3+i)*rdt*.03)}dp.needsUpdate=true;
 // camera
 camS.target.lerp(camS.goal,1-Math.pow(.02,rdt));if(camS.user>0)camS.user-=rdt;else camS.theta+=Math.sin(time*.15)*rdt*.02;
 const t=camS.target;CAM.position.set(t.x+camS.r*Math.sin(camS.theta)*Math.sin(camS.phi),camS.r*Math.cos(camS.phi)+.3,t.z+camS.r*Math.cos(camS.theta)*Math.sin(camS.phi));
 if(camS.shake>0){CAM.position.x+=(Math.random()-.5)*camS.shake*.5;CAM.position.y+=(Math.random()-.5)*camS.shake*.5;camS.shake=Math.max(0,camS.shake-rdt*1.8)}
 tmp.copy(t);tmp.y+=.2;tmp.x+=Math.sin(camS.theta)*1.6;tmp.z+=Math.cos(camS.theta)*1.6;CAM.lookAt(tmp);R.render(S,CAM);requestAnimationFrame(loop)}
resize();reset();requestAnimationFrame(loop);
if(AUTO){$('title').classList.add('hide');startGame()}
// debug/screenshot states
window.__cam=()=>JSON.stringify({p:CAM.position,t:camS.target,g:camS.goal});
window.__stage=(what)=>{$('title').classList.add('hide');reset();G.p.forEach((p,i)=>{p.pos=[4,9,20,22][i];MM[i].position.set(PATH[p.pos].x+OFF[i][0],.1,PATH[p.pos].z+OFF[i][1])});
 const nb=what=='crank'?8:5;for(let k=0;k<nb;k++){G.built++;PIECE[k].visible=true;PIECE[k].scale.setScalar(1.35);PIECE[k].userData.ghost.visible=false}if(nb==8)CAGE.visible=true;
 G.turn=0;ui();focus(MM[0].position);say('Your turn, Pip. Roll…')};
if(location.hash=='#board')__stage('board');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
